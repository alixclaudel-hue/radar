name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (deps de radar_web.app — pas de playwright/yt-dlp, jamais importés que par crate_jobs.py en sous-processus)
        run: |
          # google-auth-oauthlib/google-api-python-client : import local dans app.py (radar/ytwrite.py),
          # mais déclenché par la route /patte exercée plus bas (balayage des routes) -> nécessaires ici.
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "jinja2>=3.1" "python-multipart>=0.0.9" \
                      "requests>=2.28" "google-auth-oauthlib>=1.2" "google-api-python-client>=2.140"

      - name: Compile
        run: |
          python -m py_compile crate_jobs.py
          find radar_web radar_ops scripts -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Import des applis
        run: |
          python -c "import radar_web.app"
          python -c "import radar_ops.app"

      - name: Balayage des routes
        env:
          CRATE_DATA_DIR: ${{ runner.temp }}/data
          RADAR_NO_AUTH: "1"     # mode sans auth explicite (cf. app._dev_mode)
        run: |
          mkdir -p "$CRATE_DATA_DIR"
          python -m uvicorn radar_web.app:app --port 8600 --log-level warning &
          pid=$!
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8600/health && break
            sleep 1
          done
          fail=0
          check() {  # $1 = path, $2 = codes acceptés (regex)
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8600$1")
            if echo "$code" | grep -qE "$2"; then
              echo "  OK   $1 -> $code"
            else
              echo "  FAIL $1 -> $code"; fail=1
            fi
          }
          check /health           '200'
          check /login            '200|303'
          check /                 '200|303'
          check /patte            '200|303'
          check /search           '200|303'
          check /reco-radar       '200|303'
          # /veille (Nouveautés) en pause depuis 2026-09-17 (CLAUDE.md pt 56) :
          # 404 attendu tant que features.VEILLE_ENABLED est à False.
          check /veille           '404'
          check /univers          '200|303'
          check '/univers?tab=artists' '200|303'
          check '/univers?tab=sets'    '200|303'
          # /univers?tab=cart : ancien 4e onglet, redirige désormais vers /wantlist (pt 57)
          check '/univers?tab=cart'    '303'
          check /wantlist          '200|303'
          check /settings         '200|303'
          kill $pid 2>/dev/null || true
          exit $fail

      - name: Balayage des routes — radar_ops (diagnostic)
        env:
          CRATE_DATA_DIR: ${{ runner.temp }}/data-ops
          RADAR_NO_AUTH: "1"
        run: |
          mkdir -p "$CRATE_DATA_DIR"
          python -m uvicorn radar_ops.app:app --port 8610 --log-level warning &
          pid=$!
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8610/health && break
            sleep 1
          done
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8610$1")
            if echo "$code" | grep -qE "$2"; then
              echo "  OK   $1 -> $code"
            else
              echo "  FAIL $1 -> $code"; fail=1
            fi
          }
          check /health   '200'
          check /login    '200'
          check /         '200|303'
          check /bases    '200|303'
          check /scoring  '200|303'
          check /delegation '200|303'
          check /actions  '200|303'
          kill $pid 2>/dev/null || true
          exit $fail

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # construit l'image réellement utilisée en prod (radar_web/Dockerfile) sans la
      # publier — un Dockerfile cassé (dépendance manquante, COPY invalide...) est
      # sinon découvert seulement au déploiement sur le VPS (deploy.yml)
      - name: Build de l'image Docker (validation uniquement, pas de push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: radar_web/Dockerfile
          push: false
