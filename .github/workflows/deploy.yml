name: deploy

on:
  push:
    branches: [main]

concurrency: deploy-prod   # jamais deux déploiements en parallèle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH + health-check + rollback
        env:
          # secret = clé privée encodée en base64 (évite tout souci de retours ligne)
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd ~/radar
          prev=$(git rev-parse HEAD)
          git fetch -q origin
          git reset --hard origin/main -q
          target=$(git rev-parse --short HEAD)
          sudo docker compose up -d --build --remove-orphans

          # health-check DANS le conteneur (indépendant du binding de port hôte)
          ok=0
          for i in $(seq 1 20); do
            if sudo docker compose exec -T radar-web python -c "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8600/health',timeout=3).status==200 else 1)"; then
              ok=1; break
            fi
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "::error::health KO sur $target — rollback vers ${prev:0:7}"
            git reset --hard "$prev" -q
            sudo docker compose up -d --build --remove-orphans
            exit 1
          fi
          echo "deploy OK -> $target"
          REMOTE
