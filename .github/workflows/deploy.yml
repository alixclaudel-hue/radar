name: deploy

on:
  push:
    branches: [main]

concurrency: deploy-prod   # jamais deux déploiements en parallèle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH + health-check + rollback
        env:
          # secret = clé privée encodée en base64 (évite tout souci de retours ligne)
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd ~/radar
          prev=$(git rev-parse HEAD)
          git fetch -q origin
          git reset --hard origin/main -q
          target=$(git rev-parse --short HEAD)
          sudo docker compose up -d --build radar-web

          ok=0
          for i in $(seq 1 20); do
            h=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8600/health || true)
            s=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8600/search || true)
            [ "$h" = "200" ] && { [ "$s" = "200" ] || [ "$s" = "303" ]; } && { ok=1; break; }
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "::error::health KO sur $target — rollback vers ${prev:0:7}"
            git reset --hard "$prev" -q
            sudo docker compose up -d --build radar-web
            exit 1
          fi
          echo "deploy OK -> $target"
          REMOTE
