services:
  # Version Streamlit (référence, complète) — :8501
  crate-radar:
    build: .
    image: crate-radar:latest
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/data

  # Version FastAPI + HTMX (en construction, parité en cours) — :8600
  radar-web:
    build:
      context: .
      dockerfile: radar_web/Dockerfile
    image: radar-web:latest
    restart: unless-stopped
    ports:
      - "8600:8600"
    env_file: .env
    volumes:
      - ./data:/data

  # Worker unique de la file d'attente des jobs (étape 3) — même image
  radar-worker:
    image: radar-web:latest
    restart: unless-stopped
    command: python -m radar_web.worker
    depends_on:
      - radar-web
    env_file: .env
    volumes:
      - ./data:/data
