services:
  # Reverse-proxy + HTTPS Let's Encrypt (étape 4)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    environment:
      # Défauts NON VIDES : une variable vide casserait l'ensemble de la config
      # Caddy (cf. commentaire du Caddyfile). `${VAR:-défaut}` couvre « absente »
      # ET « présente mais vide » — .env.example laisse la ligne vide à dessein.
      RADAR_DOMAIN: ${RADAR_DOMAIN:-localhost}
      RADAR_OPS_DOMAIN: ${RADAR_OPS_DOMAIN:-ops.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - radar-web
      # radar-ops est servi sur son propre sous-domaine, Caddy démarre après lui.
      # Effet de bord utile : ajouter cette dépendance recrée le conteneur caddy
      # au prochain déploiement, ce qui recharge le Caddyfile — un fichier monté
      # n'est pas relu par un simple `docker compose up -d`.
      - radar-ops

  # Interface FastAPI + HTMX — servie publiquement par Caddy (HTTPS).
  # Le port 8600 n'est publié que sur RADAR_WEB_BIND (défaut 127.0.0.1 = local
  # seulement ; sur le VPS on met l'IP Tailscale pour l'accès admin privé).
  # (l'ancienne appli Streamlit a été retirée, cf. archive/ + docs/architecture.md étape 7)
  radar-web:
    build:
      context: .
      dockerfile: radar_web/Dockerfile
    image: radar-web:latest
    restart: unless-stopped
    ports:
      - "${RADAR_WEB_BIND:-127.0.0.1}:8600:8600"
    env_file: .env
    environment:
      RADAR_CODE_SHA: ${RADAR_CODE_SHA:-}
      # Empreinte mémoire (incident OOM du 27/09) : glibc conserve les arènes
      # malloc après les gros pics transitoires (calcul de reco_index : ~1 Go
      # alloué puis libéré) et ne rend JAMAIS ce RSS à l'OS — 2,9 Go retenus par
      # radar-web jusqu'au redémarrage suivant. MALLOC_ARENA_MAX plafonne le
      # nombre d'arènes, TRIM/MMAP forcent la restitution au noyau (une
      # allocation mmap est rendue dès free()). Mesuré : 2,79 Go -> 46 Mo au
      # repos, ~865 Mo après une requête reco chaude (au lieu de 2,9 Go).
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_MMAP_THRESHOLD_: "131072"
    volumes:
      - ./data:/data

  # Worker unique de la file d'attente des jobs (étape 3) — même image
  radar-worker:
    image: radar-web:latest
    restart: unless-stopped
    command: python -m radar_web.worker
    depends_on:
      - radar-web
    env_file: .env
    environment:
      RADAR_CODE_SHA: ${RADAR_CODE_SHA:-}
      # même plafond mémoire que radar-web : le worker relit le même
      # producer_graph.json (~286 Mo en objets Python) pour ses jobs.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_MMAP_THRESHOLD_: "131072"
    volumes:
      - ./data:/data
    # ne sert pas HTTP : le HEALTHCHECK du Dockerfile (hérité de la même image
    # que radar-web) le marquerait "unhealthy" en permanence sans ça
    healthcheck:
      disable: true

  # Tableau de bord de maintenance et de diagnostic (radar_ops).
  # Service SÉPARÉ et non une section de radar-web : il sert précisément quand
  # l'appli principale ne répond plus. Jamais exposé par Caddy — il montre les
  # données de TOUS les utilisateurs, l'accès passe par RADAR_WEB_BIND
  # (Tailscale sur le VPS, localhost ailleurs), comme l'admin de radar-web.
  radar-ops:
    image: radar-web:latest
    restart: unless-stopped
    command: uvicorn radar_ops.app:app --host 0.0.0.0 --port 8610 --forwarded-allow-ips '*'
    depends_on:
      - radar-web
    ports:
      - "${RADAR_WEB_BIND:-127.0.0.1}:8610:8610"
    env_file: .env
    environment:
      RADAR_CODE_SHA: ${RADAR_CODE_SHA:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8610/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
