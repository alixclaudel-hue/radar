services:
  # Reverse-proxy + HTTPS Let's Encrypt (étape 4)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - radar-web

  # Interface FastAPI + HTMX — :8600 (accessible seulement via Caddy et en local)
  # (l'ancienne appli Streamlit a été retirée, cf. archive/ + docs/architecture.md étape 7)
  radar-web:
    build:
      context: .
      dockerfile: radar_web/Dockerfile
    image: radar-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8600:8600"
    env_file: .env
    volumes:
      - ./data:/data

  # Worker unique de la file d'attente des jobs (étape 3) — même image
  radar-worker:
    image: radar-web:latest
    restart: unless-stopped
    command: python -m radar_web.worker
    depends_on:
      - radar-web
    env_file: .env
    volumes:
      - ./data:/data

volumes:
  caddy_data:
  caddy_config:
