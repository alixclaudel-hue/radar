<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Radar — diagnostic{% endblock %}</title>
<style>
  :root {
    --bg: #11131a; --panel: #1a1d27; --line: #2c3040; --fg: #e6e8ef;
    --dim: #9aa0b4; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
           padding: .8rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .04em; }
  nav { display: flex; gap: .2rem; flex-wrap: wrap; }
  nav a { color: var(--dim); text-decoration: none; padding: .25rem .6rem; border-radius: 4px; }
  nav a:hover { color: var(--fg); background: var(--bg); }
  nav a.on { color: var(--bg); background: var(--accent); }
  .meta { margin-left: auto; color: var(--dim); font-size: .8rem; }
  main { padding: 1rem; }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 1.6rem 0 .6rem; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-bottom: .5rem; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: .78rem;
       text-transform: uppercase; letter-spacing: .05em;
       padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
  td { padding: .35rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--panel); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .tag { display: inline-block; padding: .05rem .4rem; border-radius: 3px;
         font-size: .75rem; border: 1px solid var(--line); }
  .tag.run { border-color: var(--ok); color: var(--ok); }
  .tag.queue { border-color: var(--warn); color: var(--warn); }
  .empty { color: var(--dim); padding: .6rem .5rem; }
  .note { color: var(--dim); font-size: .82rem; margin: .2rem 0 1rem; max-width: 62ch; }
  form.inline { display: inline; }
  button { font: inherit; background: none; border: 1px solid var(--line);
           color: var(--dim); padding: .2rem .6rem; border-radius: 4px; cursor: pointer; }
  button:hover { color: var(--fg); }
  @media (max-width: 640px) { td, th { padding: .3rem .25rem; font-size: .8rem; } }
</style>
</head>
<body>
<header>
  <h1>RADAR · diagnostic</h1>
  <nav>
    <a href="/"        class="{{ 'on' if page == 'jobs' }}">Jobs &amp; file</a>
    <a href="/bases"   class="{{ 'on' if page == 'bases' }}">Bases</a>
    <a href="/scoring" class="{{ 'on' if page == 'scoring' }}">Scoring</a>
    <a href="/delegation" class="{{ 'on' if page == 'delegation' }}">Délégation</a>
    <a href="/actions" class="{{ 'on' if page == 'actions' }}">Actions</a>
  </nav>
  <span class="meta">
    code {{ sha or 'inconnu' }}
    <form class="inline" method="post" action="/logout"><button>quitter</button></form>
  </span>
</header>
<main>{% block body %}{% endblock %}</main>
{% block script %}{% endblock %}
</body>
</html>
