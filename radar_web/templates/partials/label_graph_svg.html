<div class="lgraph">
  <p class="small muted">
    {{ graph.seeds|join(', ') }} · niveau {{ graph.depth }} · {{ graph.nodes|length }} labels · {{ graph.edges|length }} liens
    {% if graph.min_shared %}· ≥{{ graph.min_shared }} artiste(s) commun(s){% endif %}
  </p>
  <svg viewBox="0 0 560 560" width="100%" style="max-width:560px;display:block;margin:0 auto">
    {% for e in graph.edges %}
      {% if pos.get(e.a) and pos.get(e.b) %}
      <line x1="{{ pos[e.a][0] }}" y1="{{ pos[e.a][1] }}" x2="{{ pos[e.b][0] }}" y2="{{ pos[e.b][1] }}"
            stroke="var(--line)" stroke-width="{{ [1 + e.w, 5]|min }}" opacity="0.7"></line>
      {% endif %}
    {% endfor %}
    {% for k, n in graph.nodes.items() %}
      {% if pos.get(k) %}
      {% set p = pos[k] %}
      {% set r = 9 if n.level == 0 else (6 if n.level == 1 else 4) %}
      <circle cx="{{ p[0] }}" cy="{{ p[1] }}" r="{{ r }}"
              fill="{{ 'var(--pin)' if n.level == 0 else ('var(--clay)' if n.level == 1 else 'var(--soft)') }}"></circle>
      <text x="{{ p[0] }}" y="{{ p[1] - r - 4 }}" font-size="{{ 11 if n.level < 2 else 9 }}"
            text-anchor="middle" fill="var(--ink)" font-family="inherit">{{ n.name[:24] }}</text>
      {% endif %}
    {% endfor %}
  </svg>
  <p class="small muted" style="text-align:center">
    <span style="color:var(--pin)">●</span> graine
    <span style="color:var(--clay)">●</span> niveau 1
    {% if graph.depth > 1 %}<span style="color:var(--soft)">●</span> niveau 2{% endif %}
  </p>
</div>
