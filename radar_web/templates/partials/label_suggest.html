{% if not rows %}
  <div class="lbl-suggest__head small muted">Aucun label dans ta base.</div>
{% else %}
  <div class="lbl-suggest__head small muted">{{ header }}</div>
  {% for r in rows %}
  <button type="button" class="lbl-opt" data-v="{{ r.disp }}">
    <span class="lbl-opt__name">{{ r.disp }}</span>
    {% if r.aff is not none %}<span class="badge {{ 'clay' if r.aff < 50 }}">{{ r.aff }}</span>{% endif %}
  </button>
  {% endfor %}
{% endif %}
