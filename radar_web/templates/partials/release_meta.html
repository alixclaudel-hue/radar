<div class="cover-meta">
  {% if m.rating %}<span class="cm cm--star" title="{{ m.rcount or 0 }} votes Discogs">★ {{ '%.2f'|format(m.rating) }}</span>{% endif %}
  {% if m.low %}<span class="cm">dès {{ m.low|round(0)|int }} €</span>{% endif %}
  {% if m.nfs is not none %}<span class="cm">{{ m.nfs }} en vente</span>{% endif %}
  {% if m.get('fr') is not none %}
    <a class="cm cm--fr" href="https://www.discogs.com/sell/release/{{ rid }}?ships_from=France"
       target="_blank" rel="noopener" title="Annonces localisées en France">🇫🇷 {{ m.fr }}</a>
  {% else %}
    <a class="cm cm--fr" href="https://www.discogs.com/sell/release/{{ rid }}?ships_from=France"
       target="_blank" rel="noopener" title="Voir les annonces localisées en France">🇫🇷 voir</a>
  {% endif %}
</div>
